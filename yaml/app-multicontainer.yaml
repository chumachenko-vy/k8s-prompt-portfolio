apiVersion: v1
kind: Pod
metadata:
  name: app-two-containers
spec:
  volumes:
  - name: html
    emptyDir: {}
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
  - name: content-writer
    image: debian
    command: ["/bin/sh", "-c"]
    args:
    - |
      while true; do
        date >> /html/index.html
        sleep 1
      done
    volumeMounts:
    - name: html
      mountPath: /html
