apiVersion: v1
kind: Pod
metadata:
  name: app-livenessprobe
  namespace: demo
spec:
  containers:
  - name: app
    image: gcr.io/smartcity-gl/demo:v1.0.1
    ports:
    - containerPort: 8000
      name: http
    livenessProbe:
      httpGet:
        path: /
        port: 8000
      initialDelaySeconds: 5
      timeoutSeconds: 1
      periodSeconds: 10
      failureThreshold: 3
